# Salesforce renames and retires Setup pages with each release, and the palette's
# quick-links are hard-coded URL segments. Run this by hand (Actions tab, or
# `SF_ORG=<alias> npm run test:links` locally) to open every one in a Developer
# Edition org (always on the latest release); a dead link fails the job. See test/links.js.
#
# Needs one repository secret: SFDX_AUTH_URL — the "Sfdx Auth Url" line from
# `sf org display --verbose --target-org <alias>` for the org to test.
name: Setup link check

on:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @salesforce/cli
      - name: Log in to the test org
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias linkcheck
      - name: Open every quick-link
        env:
          SF_ORG: linkcheck
        run: npm run test:links
